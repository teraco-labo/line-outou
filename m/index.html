<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>教材｜てらこ図書館</title>
<!-- 図書館の教材（PDF）を、上に「てらこ図書館に戻る」を付けて見せるページ（2026-11-06）。
     スマホで PDF を直接開くと戻り道が無く、ブラウザの戻るで全部戻る・閉じてしまう（生徒の富山さんの声）。
     ?f=materials/〇〇.pdf&t=題名 で開く。materials/ の PDF 以外は開かない -->
<style>
  :root{--bg:#faf8f4;--card:#fff;--ink:#2a2622;--sub:#6d655c;--line:#e4ddd2;--accent:#b0561f;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
    padding:10px 16px calc(10px);padding-top:max(10px,env(safe-area-inset-top));display:flex;gap:10px;align-items:center;}
  .back{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;text-decoration:none;
    font-weight:700;font-size:16px;padding:12px 16px;border-radius:12px;border:0;cursor:pointer;font-family:inherit;}
  .ttl{flex:1;min-width:0;font-size:13px;color:var(--sub);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .pages{max-width:900px;margin:0 auto;padding:12px 10px 24px;}
  .pg{background:#fff;margin:0 0 10px;box-shadow:0 1px 4px rgba(0,0,0,.12);border-radius:4px;overflow:hidden;}
  .pg canvas{display:block;width:100%;height:auto;}
  .msg{text-align:center;color:var(--sub);font-size:15px;padding:40px 16px;line-height:1.7;}
  .foot{max-width:900px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:12px;align-items:center;}
  .foot .back{font-size:17px;padding:14px 22px;}
  .raw{color:var(--accent);font-size:14px;}
</style>
</head>
<body>
<div class="bar">
  <a class="back" id="back" href="../">← てらこ図書館に戻る</a>
  <div class="ttl" id="ttl"></div>
</div>
<div class="pages" id="pages"><p class="msg">読み込んでいます…</p></div>
<div class="foot">
  <a class="back" id="back2" href="../">← てらこ図書館に戻る</a>
  <a class="raw" id="raw" href="#" target="_blank" rel="noopener">印刷・保存はこちら（PDFをそのまま開く）</a>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  const q = new URLSearchParams(location.search);
  const f = q.get('f') || '', t = q.get('t') || '';
  const box = document.getElementById('pages');
  document.getElementById('ttl').textContent = t;
  if (t) document.title = t + '｜てらこ図書館';

  // 戻る：図書館から来たときはブラウザの戻る（開いた段や鍵がそのまま残りやすい）、そうでなければ図書館へ
  const lib = new URL('../', location.href).href;
  const fromLib = document.referrer && document.referrer.split('#')[0].split('?')[0] === lib;
  ['back', 'back2'].forEach(id => document.getElementById(id).addEventListener('click', ev => {
    if (fromLib && history.length > 1) { ev.preventDefault(); history.back(); }
  }));

  if (!/^materials\/[^/]+\.pdf$/.test(f)) { box.innerHTML = '<p class="msg">教材が見つかりませんでした。<br>図書館に戻って、もう一度えらんでください。</p>'; return; }
  const src = '../' + f;
  document.getElementById('raw').href = src;
  if (!window.pdfjsLib) { location.replace(src); return; }   // 読み込めないときは PDF をそのまま開く
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  pdfjsLib.getDocument(src).promise.then(async pdf => {
    box.innerHTML = '';
    const first = await pdf.getPage(1), v0 = first.getViewport({ scale: 1 });
    const holders = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const d = document.createElement('div'); d.className = 'pg'; d.dataset.n = i;
      d.style.aspectRatio = v0.width + ' / ' + v0.height;
      box.appendChild(d); holders.push(d);
    }
    const draw = async d => {
      if (d.dataset.done) return; d.dataset.done = 1;
      const page = await pdf.getPage(+d.dataset.n);
      const w = d.clientWidth * Math.min(window.devicePixelRatio || 1, 2);
      const vp = page.getViewport({ scale: w / page.getViewport({ scale: 1 }).width });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      d.style.aspectRatio = ''; d.appendChild(c);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    };
    const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { io.unobserve(x.target); draw(x.target); } }), { rootMargin: '800px 0px' });
    holders.forEach(d => io.observe(d));
  }).catch(() => { location.replace(src); });
})();
</script>
</body>
</html>
