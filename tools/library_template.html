<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<meta name="robots" content="noindex">
<title>てらこ図書館 | TERACO.LABO</title>
<meta name="description" content="TERACO.LABOの教材置き場「てらこ図書館」">
<style>
  :root{
    --bg:#faf8f4;
    --card:#ffffff;
    --ink:#2b2823;
    --sub:#8d867b;
    --accent:#b0561f;
    --accent-soft:#f4e9dd;
    --line:#e7e0d4;
    --hairline:#eee8dd;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
    font-feature-settings:"palt";
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 22px 88px;}

  header{
    text-align:center;
    padding:64px 18px 44px;
  }
  .brand{
    font-size:11px;
    letter-spacing:.34em;
    color:var(--sub);
    font-weight:600;
    text-indent:.34em;
  }
  header h1{
    font-size:30px;
    margin-top:14px;
    line-height:1.4;
    font-weight:700;
    letter-spacing:.08em;
  }
  header .rule{
    width:36px;height:2px;background:var(--accent);
    margin:20px auto 0;
  }
  header p.lead{
    margin-top:18px;
    color:var(--sub);
    font-size:13.5px;
    letter-spacing:.05em;
  }

  /* ===== 年代グループ（アコーディオン） ===== */
  .group-acc{
    border-top:1px solid var(--line);
  }
  .group-acc:last-of-type{
    border-bottom:1px solid var(--line);
  }
  .group-acc>summary{
    list-style:none;
    cursor:pointer;
    display:flex;
    align-items:baseline;
    gap:14px;
    padding:26px 6px;
    user-select:none;
    transition:background .2s ease;
  }
  .group-acc>summary::-webkit-details-marker{display:none;}
  @media(hover:hover){.group-acc>summary:hover{background:rgba(176,86,31,.03);}}
  .group-acc>summary .group-no{
    font-size:12px;
    font-weight:600;
    color:var(--accent);
    letter-spacing:.1em;
    font-variant-numeric:tabular-nums;
    flex:none;
  }
  .group-acc>summary .group-name{
    flex:1;min-width:0;
    font-size:18px;
    font-weight:700;
    letter-spacing:.06em;
  }
  .group-acc>summary .group-name .lock{
    width:13px;height:13px;
    margin-left:8px;
    color:#b9b2a6;
    vertical-align:-1px;
  }
  .group-acc>summary .group-count{
    font-size:11.5px;
    color:var(--sub);
    letter-spacing:.06em;
    flex:none;
  }
  .group-acc>summary .group-chev{
    flex:none;
    color:var(--sub);
    font-size:11px;
    transition:transform .25s ease;
    align-self:center;
  }
  .group-acc[open]>summary .group-chev{transform:rotate(90deg);}
  .group-acc .group-body{
    padding:2px 6px 30px;
  }

  /* ===== 講座アコーディオン ===== */
  .acc{
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--card);
    margin-bottom:12px;
    overflow:hidden;
  }
  .acc>summary{
    list-style:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    padding:17px 18px;
    font-size:15px;
    font-weight:700;
    letter-spacing:.03em;
    user-select:none;
    transition:background .2s ease;
  }
  .acc>summary::-webkit-details-marker{display:none;}
  @media(hover:hover){.acc>summary:hover{background:#fcfaf6;}}
  .acc>summary .stitle{flex:1;min-width:0;}
  .acc>summary .count{
    font-size:11px;
    font-weight:600;
    color:var(--sub);
    letter-spacing:.06em;
    flex:none;
  }
  .acc>summary .chev{
    flex:none;color:var(--accent);font-size:10px;
    transition:transform .25s ease;
  }
  .acc[open]>summary{
    border-bottom:1px solid var(--hairline);
    background:#fcfaf6;
  }
  .acc[open]>summary .chev{transform:rotate(90deg);}
  .acc-body{
    padding:6px 18px 14px;
  }

  /* ===== 教材リンク（行スタイル） ===== */
  .card{
    display:flex;
    align-items:baseline;
    gap:14px;
    padding:13px 2px;
    text-decoration:none;
    color:inherit;
    border-bottom:1px solid var(--hairline);
    transition:opacity .15s ease;
  }
  .acc-body .card:last-of-type,
  .acc-body .card:last-child{border-bottom:none;}
  @media(hover:hover){.card.live:hover .t{color:var(--accent);}}
  .num{
    flex:none;
    font-size:12px;
    font-weight:600;
    color:var(--accent);
    letter-spacing:.05em;
    font-variant-numeric:tabular-nums;
    width:22px;
  }
  .card-body{flex:1;min-width:0;}
  .card-body .t{
    font-size:14.5px;font-weight:700;letter-spacing:.02em;
    transition:color .15s ease;
  }
  .card-body .s{font-size:12px;color:var(--sub);margin-top:3px;letter-spacing:.02em;}
  .arrow{color:var(--accent);font-size:13px;flex:none;align-self:center;}

  .card.soon{opacity:.45;}
  /* 新作の目印 */
  .badge.new{color:#fff;background:var(--accent);border-color:var(--accent);margin-left:8px;}
  .card .badge.new{margin:0 4px 0 6px;}
  .card.soon .num{color:var(--sub);}
  .badge{
    font-size:10.5px;font-weight:600;
    color:var(--sub);border:1px solid var(--line);
    padding:2px 10px;border-radius:999px;flex:none;
    letter-spacing:.05em;
    align-self:center;
  }

  /* 準備中の予告行 */
  .teaser{
    display:flex;align-items:center;gap:12px;
    border:1px dashed var(--line);
    border-radius:12px;
    padding:17px 18px;
    color:var(--sub);font-size:13.5px;
    letter-spacing:.03em;
  }
  .teaser .stitle{flex:1;font-weight:700;}
  .teaser .badge{flex:none;}

  /* 講座内のテンプレート案内 */
  .tool-note{
    display:flex;align-items:center;gap:10px;
    margin:10px 0 4px;
    padding:12px 14px;
    background:var(--accent-soft);
    border-radius:9px;
    text-decoration:none;color:var(--accent);
    font-size:12.5px;font-weight:700;
    letter-spacing:.03em;
  }
  .tool-note .arrow{margin-left:auto;color:var(--accent);}

  /* プロンプト直接リンク */
  .linkbar{
    display:flex;align-items:center;gap:12px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--card);
    padding:17px 18px;
    margin-bottom:12px;
    font-size:15px;font-weight:700;
    letter-spacing:.03em;
    text-decoration:none;color:inherit;
    transition:background .2s ease;
  }
  @media(hover:hover){.linkbar:hover{background:#fcfaf6;}
    .linkbar:hover .stitle{color:var(--accent);}}
  .linkbar .stitle{flex:1;min-width:0;transition:color .15s ease;}
  .linkbar .note{
    font-size:11px;color:var(--sub);flex:none;letter-spacing:.05em;
  }
  .linkbar .go{flex:none;color:var(--accent);font-size:13px;}
  @media(max-width:520px){
    .linkbar{flex-wrap:wrap;}
    .linkbar .stitle{flex:1 1 auto;}
    .linkbar .go{order:2;}
    .linkbar .note{flex-basis:100%;order:3;margin-top:2px;}
  }

  .home-text{display:block;text-align:right;font-size:12.5px;color:var(--accent);text-decoration:none;margin:-4px 6px 12px 0;}
  .home-text:hover{text-decoration:underline;}
  .old-wrap{margin-top:40px;padding-top:8px;border-top:1px dashed var(--line);opacity:.92;}
  .channel{display:flex;align-items:center;gap:10px;margin:28px 0 8px;padding:16px 18px;border-radius:14px;background:#c4302b;color:#fff;text-decoration:none;}
  .channel .ch-t{font-weight:700;font-size:15px;}
  .channel .ch-s{font-size:13px;opacity:.95;flex:1;}
  .channel .go{font-weight:700;}
  footer{
    text-align:center;
    margin-top:72px;
    padding-top:28px;
    color:var(--sub);
    font-size:11px;
    letter-spacing:.2em;
  }
  footer a{color:var(--sub);text-decoration:none;}

  /* ===== 2026-10-10 講座ごと・回 × 種類（スライド → 復習テキスト → 動画） ===== */
  .list-title{font-size:12px;color:var(--sub);letter-spacing:.14em;margin:0 4px 12px;}
  .acc>summary{display:grid;grid-template-columns:1fr auto auto;column-gap:12px;row-gap:6px;}
  .aud{display:inline-block;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);
       border-radius:999px;padding:2px 10px;letter-spacing:.06em;justify-self:start;}
  .acc>summary .aud{grid-column:1/-1;}
  .ep{display:flex;gap:10px;padding:14px 2px;border-bottom:1px solid var(--hairline);}
  .acc-body .ep:last-of-type{border-bottom:none;}
  .ep .num{padding-top:2px;}
  .ep-main{flex:1;min-width:0;}
  .ep-main .t{font-size:14.5px;font-weight:700;letter-spacing:.02em;}
  .ep-main .badge.new{margin-left:6px;vertical-align:1px;}
  .ep-main .s{display:block;font-size:12px;color:var(--sub);margin-top:3px;letter-spacing:.02em;}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .btn{display:inline-flex;align-items:center;min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);
       background:#fff;color:var(--ink);font-size:13px;font-weight:700;text-decoration:none;letter-spacing:.04em;}
  .btn.main{background:var(--accent);border-color:var(--accent);color:#fff;}
  @media(hover:hover){.btn:hover{border-color:var(--accent);color:var(--accent);} .btn.main:hover{color:#fff;opacity:.9;}}
  
  @media(max-width:430px){.group-acc .group-body{padding:2px 0 24px;} .acc-body{padding:4px 12px 12px;} .acc>summary{padding:16px 14px;}
    .ep{gap:8px;} .ep .num{width:20px;} .btn{padding:0 11px;font-size:12.5px;}}
  /* ===== プロンプト/リンク集（2026-10-13） ===== */
  .grip{flex:none;width:18px;height:24px;margin-left:8px;cursor:grab;touch-action:none;opacity:.45;border-radius:4px;
    background-image:radial-gradient(circle,var(--sub) 1.6px,transparent 1.8px);background-size:6px 6px;background-position:3px 3px;}
  .grip:hover{opacity:.9;}
  .acc>summary:has(.grip){grid-template-columns:1fr auto auto auto;}
  .dragging{opacity:.75;outline:2px dashed var(--accent);outline-offset:2px;}
  body.drg{user-select:none;-webkit-user-select:none;cursor:grabbing;}
  .edit-note{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;font-size:13px;text-align:center;padding:8px 12px;border-radius:0 0 10px 10px;margin:0 0 12px;}
  .ord-toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;z-index:9;}
  .sub-h{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.12em;margin:18px 4px 8px;}
  .sub-h:first-child{margin-top:4px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 16px;margin-bottom:6px;}
  .tpl{padding:12px 0;border-bottom:1px solid var(--hairline);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;}
  .tpl:last-child{border-bottom:none;}
  .tpl .name{font-size:14px;font-weight:700;letter-spacing:.02em;}
  .tpl .btns{margin-top:0;}
  .gate{border:1px dashed var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:var(--card);}
  .gate-t{font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .gate .row{display:flex;gap:10px;margin-top:12px;}
  .gate input{flex:1;min-width:0;font-size:18px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;}
  .gate button{font:inherit;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:10px;padding:0 20px;cursor:pointer;}
  .gate .msg{font-size:13px;color:var(--accent);margin-top:8px;min-height:18px;}
  /* さがす（2026-10-25 藤崎さん「講座が増えてきたら検索機能がいるね」） */
  .search{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:12px 16px;margin:0 0 18px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);}
  .search:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
  .hit-none{display:none;color:var(--sub);font-size:14px;text-align:center;margin:12px 0 24px;}
  .is-hidden{display:none !important;}
  .btn small{display:block;font-size:11px;font-weight:500;opacity:.85;line-height:1.2;margin-top:2px;}
  .btn:has(small){flex-direction:column;justify-content:center;line-height:1.25;padding-top:7px;padding-bottom:7px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">TERACO.LABO</div>
    <h1>てらこ図書館</h1>
    <div class="rule"></div>
    <p class="lead">講座で使う教材を、いつでも読み返せます</p>
  </header>

  <input class="search" id="q" type="search" placeholder="さがす（例：LINE、体験会、第2回）" aria-label="講座と教材をさがす">
  <p class="hit-none" id="hitNone">見つかりませんでした。ほかの言葉でさがしてみてください</p>
  <!-- 講座の一覧は tools/build_library.py が library.json から作る。ここを手で直さない -->
  {{COURSES}}
  {{GATE}}

  <!-- ===== プロンプト/リンク集（tools/build_library.py が library.json の links と講座のテンプレートから作る） ===== -->
  {{LINKS}}
  {{CHANNEL}}

  <footer>
    <a href="https://teraco-labo.com/" target="_blank" rel="noopener">TERACO.LABO</a>
  </footer>
</div>
<script>
// 「スマホ教室てらこ」の段の鍵（lock_students が true のときだけ働く）。番号はこのページの中だけで使い、どこにも送らない・残さない
if ({{LOCK_SCRIPT}}) {
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function unlock(file, pass) {
    const box = await (await fetch(file, { cache: 'no-store' })).json();
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(box.salt), iterations: box.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(box.iv) }, key, b64(box.data)));
  }
  document.getElementById('gate').addEventListener('submit', async ev => {
    ev.preventDefault();
    const pass = document.getElementById('pw').value.trim(), msg = document.getElementById('msg');
    if (!pass) { msg.textContent = '番号を入れてください'; return; }
    msg.textContent = 'たしかめています…';
    try {
      if (await unlock('students-check.lock', pass) !== 'teraco-students-ok') throw 0;
      document.getElementById('locked').innerHTML = await unlock('students.lock', pass);
      document.getElementById('gate').hidden = true;
    } catch (_) { msg.textContent = '番号がちがいます'; }
  });
}
</script>
<script>
// さがす：講座名・回の題名・説明に入っている言葉で、当てはまる回だけを残して開く（消すと元に戻る）
(function () {
  const q = document.getElementById('q'), none = document.getElementById('hitNone');
  if (!q) return;
  const norm = s => (s || '').replace(/\s+/g, '').toLowerCase();
  q.addEventListener('input', () => {
    const w = norm(q.value);
    let hits = 0;
    document.querySelectorAll('details.group-acc').forEach(g => {
      let gHit = false;
      g.querySelectorAll('details.acc').forEach(c => {
        const title = c.querySelector('summary') ? c.querySelector('summary').textContent : '';
        let cHit = false;
        const eps = c.querySelectorAll('.ep');
        eps.forEach(ep => { const ok = !w || norm(title + ep.textContent).includes(w); ep.classList.toggle('is-hidden', !ok); if (ok) cHit = true; });
        if (!eps.length) cHit = !w || norm(c.textContent).includes(w);
        c.classList.toggle('is-hidden', !cHit);
        if (w) c.open = cHit;
        if (cHit) { gHit = true; if (w) hits++; }
      });
      g.classList.toggle('is-hidden', !!w && !gHit);
      if (w) g.open = gHit;
    });
    none.style.display = w && !hits ? 'block' : 'none';
  });
})();
</script>
<script>
// 並び替え（2026-10-27 藤崎さん「図書館も同じようにドラッグで並び替えできるようにして」）
// 並びは Teraco Shelf と同じ倉庫の order.json。誰でも読めるので、開いたときにこの並びで出す。
// つまみ（点々）は Teraco Shelf の「図書館を並び替える」から開いたとき（?edit=1 と書き込みの合図つき）だけ出す。生徒さんには出ない
(function () {
  const URL_ = '{{ORDER_URL}}'; if (!URL_) return;
  const wrap = document.querySelector('.wrap');
  let order = {}, PUT = null;
  const m = location.hash.match(/put=([^&]+)/);
  if (m) { try { sessionStorage.setItem('lib-put', decodeURIComponent(m[1])); } catch (_) {} history.replaceState(null, '', location.pathname + location.search); }
  try { PUT = sessionStorage.getItem('lib-put'); } catch (_) {}
  const edit = /[?&]edit=1/.test(location.search) && !!PUT;
  const boxes = () => [[wrap, 'top']].concat([...document.querySelectorAll('.grp[data-g]')].map(g => [g, g.dataset.g]));
  const items = p => [...p.children].filter(c => c.tagName === 'DETAILS' && c.dataset.k);
  const keyOf = p => p === wrap ? 'top' : p.dataset.g;
  function toast(t) { let el = document.querySelector('.ord-toast'); if (!el) { el = document.createElement('div'); el.className = 'ord-toast'; document.body.appendChild(el); }
    el.textContent = t; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => { el.hidden = true; }, 3000); }
  function renumber() { let i = 1; wrap.querySelectorAll(':scope>details.group-acc, :scope>.old-wrap>details.group-acc').forEach(d => { const n = d.querySelector('.group-no'); if (n) n.textContent = String(i++).padStart(2, '0'); }); }
  function apply() {
    boxes().forEach(([box, k]) => {
      const want = order[k]; if (!want || !want.length) return;
      const arr = items(box); if (arr.length < 2) return;
      const pos = {}; want.forEach((x, i) => { pos[x] = i; });
      const sorted = arr.map((el, i) => [el.dataset.k in pos ? pos[el.dataset.k] : 1e4 + i, el]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
      const ph = document.createComment(''); box.insertBefore(ph, arr[0]); sorted.forEach(el => box.insertBefore(el, ph)); ph.remove();
    });
    renumber();
    if (edit) boxes().forEach(([box]) => items(box).forEach(d => {
      const sm = d.querySelector(':scope>summary'); if (!sm || sm.querySelector('.grip')) return;
      const g = document.createElement('span'); g.className = 'grip'; g.title = 'ドラッグで並び替え';
      const chev = sm.querySelector('.group-chev,.chev'); sm.insertBefore(g, chev || null);
    }));
  }
  if (edit) { const n = document.createElement('div'); n.className = 'edit-note'; n.textContent = '並び替えモード：右の点々をドラッグすると並びが変わります（生徒さんには出ません）'; wrap.prepend(n); }
  document.addEventListener('click', ev => { if (ev.target.classList && ev.target.classList.contains('grip')) { ev.preventDefault(); ev.stopPropagation(); } }, true);
  document.addEventListener('pointerdown', ev => {
    const g = ev.target.closest && ev.target.closest('.grip'); if (!g) return;
    ev.preventDefault();
    const el = g.closest('details'), par = el.parentElement; let moved = false;
    el.classList.add('dragging'); document.body.classList.add('drg');
    const mv = e => {
      if (e.clientY < 70) window.scrollBy(0, -14); else if (e.clientY > innerHeight - 70) window.scrollBy(0, 14);
      const sib = items(par).filter(c => c !== el && !c.classList.contains('is-hidden'));
      let before = null;
      for (const s of sib) { const r = s.getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { before = s; break; } }
      if (before) { if (el.nextElementSibling !== before) { par.insertBefore(el, before); moved = true; } }
      else { const last = sib[sib.length - 1]; if (last && last.nextSibling !== el) { par.insertBefore(el, last.nextSibling); moved = true; } }
    };
    const up = () => {
      document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
      el.classList.remove('dragging'); document.body.classList.remove('drg');
      if (!moved) return;
      order[keyOf(par)] = items(par).map(c => c.dataset.k); renumber();
      fetch(PUT, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ order }) })
        .then(r => toast(r.ok ? '並びを保存しました' : '保存できませんでした（シェルフから開き直してください）'))
        .catch(() => toast('保存できませんでした（ネットの接続を確かめてください）'));
    };
    document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
  });
  const lk = document.getElementById('locked'); if (lk) new MutationObserver(apply).observe(lk, { childList: true });
  fetch(URL_ + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).then(j => { order = (j && j.order) || {}; apply(); }).catch(() => apply());
})();
</script>
